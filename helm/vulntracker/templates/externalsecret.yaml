{{- if .Values.externalSecrets.enabled }}
# Pulls SECRET_KEY from the external secrets manager and materialises it as a
# Kubernetes Secret. The real value exists only in the manager and in the pod's
# environment at run time - never in this repository, never in a rendered
# manifest, and never in the container image.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-api-secrets
  labels:
    app: {{ .Release.Name }}-api
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.secretName }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    # JWT signing key. Rotating it in the manager invalidates issued tokens
    # after refreshInterval, which is the desired behaviour on compromise.
    - secretKey: SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: secret_key
{{- end }}
