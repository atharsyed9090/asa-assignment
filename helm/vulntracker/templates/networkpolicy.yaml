{{- if .Values.networkPolicy.enabled }}
# Default-deny in both directions, then open only the flows the service needs.
# Without this, any compromised workload in the cluster could reach the API port
# directly and bypass the ingress controller entirely.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: {{ .Release.Name }}-api
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller, and only on the API port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The notification service this API calls on scan create and update.
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.networkPolicy.notifyServiceLabel }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.notifyServicePort }}
{{- end }}
