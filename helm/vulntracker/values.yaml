replicaCount: 1  # SHARED_LINKS is in-memory, not shared across pods

image:
  repository: vulntracker-api
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Default-deny network policy. Only the ingress controller may reach the API,
# and the API may only talk to cluster DNS and the notification service.
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  notifyServiceLabel: vulntracker-notify
  notifyServicePort: 3001

# Secrets are delivered by the External Secrets Operator, which reads the real
# values from the external manager. This chart references names and remote keys
# only, so no secret value is committed or appears in a rendered manifest.
externalSecrets:
  enabled: true
  secretName: vulntracker-api-secrets
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  remoteKey: prod/vulntracker/api
